# Builds, signs, notarizes, and publishes OakMate.
#
# Releases: pushing a version tag publishes a release. The tag must match the
# newest entry in Applications/OakMate/about/Changes.md, e.g. ‘## 2026-11-01 (v2.1.0)’
# is released by pushing the tag ‘v2.1.0’.
#
# Nightlies: every night (or when run manually) a pre-release is published
# when the newest entry in Changes.md has no date yet, e.g. ‘## Unreleased (v2.1.8)’,
# and main has commits that are not in the previous nightly (a manual run
# always builds). Nightlies are
# versioned ‘2.1.8-nightly.YYYYMMDD.HHMM’, which sorts after 2.1.7 and before
# 2.1.8, are tagged ‘v«version»’, and only the newest few are kept.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   DEVELOPER_ID_CERTIFICATE_P12       Base64 encoded .p12 with the “Developer ID Application” certificate and its private key
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  Password of the .p12 file
#   NOTARIZATION_APPLE_ID              Apple ID used for notarization
#   NOTARIZATION_PASSWORD              App-specific password for that Apple ID (appleid.apple.com)
#   NOTARIZATION_TEAM_ID               Team ID of the developer account (10 characters)

name: Release

on:
  push:
    tags: [ 'v*', '!v*-nightly.*' ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Create the GitHub release

concurrency:
  group: release-${{ github.ref }}

env:
  CHANGES: Applications/OakMate/about/Changes.md
  NIGHTLIES_TO_KEEP: 7

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      nightly: ${{ steps.plan.outputs.nightly }}
      version: ${{ steps.plan.outputs.version }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Tags of previous nightlies

    - name: Plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        heading=$(grep -m1 '^## .* (v.*)$' "$CHANGES")
        version=$(sed 's/.*(v\(.*\))/\1/' <<< "$heading")
        is_dated=false
        [[ "$heading" == "## "[0-9][0-9][0-9][0-9]-* ]] && is_dated=true

        if [[ "$GITHUB_EVENT_NAME" == push ]]; then
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest version in $CHANGES ($version)"
            exit 1
          fi
          if [[ $is_dated != true ]]; then
            echo "::error::Set the release date in $CHANGES: $heading"
            exit 1
          fi
          { echo "build=true"; echo "nightly=false"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]]; then
          echo "::error::Nightlies are built from ${{ github.event.repository.default_branch }}, not $GITHUB_REF_NAME"
          exit 1
        fi

        if [[ $is_dated == true ]]; then
          echo "::notice::No nightly: the newest entry in $CHANGES has a release date ($heading)"
          echo "build=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        previous=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq '[ .[] | select(.isPrerelease and (.tagName | test("-nightly\\."))) ] | sort_by(.createdAt) | last | .tagName // empty')
        if [[ "$GITHUB_EVENT_NAME" == schedule && -n "$previous" && "$(git rev-list -n 1 "$previous" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
          echo "::notice::No nightly: $previous was built from the same commit"
          echo "build=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        { echo "build=true"; echo "nightly=true"; echo "version=$version-nightly.$(date -u +%Y%m%d.%H%M)"; } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    environment: release

    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NIGHTLY: ${{ needs.plan.outputs.nightly }}

    steps:
    - name: Set paths
      run: |
        echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
        echo "BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # The Contributions page is generated from the commit history

    - name: Prepare release notes
      run: |
        if [[ "$NIGHTLY" == true ]]; then
          # The application takes its version from the newest entry in Changes.md
          sed -i '' -E "1,/^## .* \(v.*\)$/s/^## (.*) \(v.*\)$/## \1 (v$VERSION)/" "$CHANGES"
          grep -m1 "^## .* (v$VERSION)$" "$CHANGES"
        fi

        bin/extract_changes -v "$VERSION" "$CHANGES" | tail -n +2 > "$RUNNER_TEMP/notes.md"
        if [[ "$NIGHTLY" == true ]]; then
          printf '\nNightly build of %s. Nightly builds contain changes that are not released yet and may be less stable than releases.\n' "${GITHUB_SHA:0:8}" >> "$RUNNER_TEMP/notes.md"
        fi

    - name: Select newest Xcode
      run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

    - name: Install ninja
      run: brew install ninja

    - name: Import signing certificate
      env:
        CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      run: |
        keychain_password=$(uuidgen)
        security create-keychain -p "$keychain_password" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$keychain_password" "$KEYCHAIN"

        base64 --decode <<< "$CERTIFICATE_P12" > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm "$RUNNER_TEMP/certificate.p12"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{ print $2 }')
        if [[ -z "$identity" ]]; then
          echo "::error::No “Developer ID Application” identity found in the certificate"
          exit 1
        fi
        printf 'set CS_IDENTITY "%s"\n' "$identity" > local.rave

    - name: Build
      run: |
        mkdir -p "$BUILD_DIR"
        builddir="$BUILD_DIR" ./configure
        ninja OakMate
        ninja test
      timeout-minutes: 60
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Notarize
      env:
        APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
      run: |
        app="$BUILD_DIR/release/Applications/OakMate/OakMate.app"
        codesign --verify --deep --strict --verbose=2 "$app"

        built_version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
        if [[ "$built_version" != "$VERSION" ]]; then
          echo "::error::Built version $built_version, expected $VERSION"
          exit 1
        fi

        notarize () {
          xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/notarization.json" || true
          id=$(plutil -extract id raw "$RUNNER_TEMP/notarization.json")
          xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
          [[ $(plutil -extract status raw "$RUNNER_TEMP/notarization.json") == Accepted ]]
        }

        mkdir -p dist
        ditto -c -k --keepParent "$app" "$RUNNER_TEMP/OakMate.zip"
        notarize "$RUNNER_TEMP/OakMate.zip"
        xcrun stapler staple "$app"
        ditto -c -k --keepParent "$app" "dist/OakMate-$VERSION.zip"

        identity=$(sed -n 's/set CS_IDENTITY "\(.*\)"/\1/p' local.rave)
        mkdir "$RUNNER_TEMP/dmg"
        ditto "$app" "$RUNNER_TEMP/dmg/OakMate.app"
        ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
        hdiutil create -volname "OakMate $VERSION" -srcfolder "$RUNNER_TEMP/dmg" -fs APFS -format UDZO "dist/OakMate-$VERSION.dmg"
        codesign --sign "$identity" --timestamp "dist/OakMate-$VERSION.dmg"
        notarize "dist/OakMate-$VERSION.dmg"
        xcrun stapler staple "dist/OakMate-$VERSION.dmg"

        (cd dist && shasum -a 256 * > SHA256SUMS)

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "$NIGHTLY" == true ]]; then
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --prerelease --latest=false --title "OakMate $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        else
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "OakMate $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        fi

    - name: Remove old nightlies
      if: env.NIGHTLY == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq '[ .[] | select(.isPrerelease and (.tagName | test("-nightly\\."))) ] | sort_by(.createdAt) | reverse | .[(env.NIGHTLIES_TO_KEEP | tonumber):] | .[].tagName' |
        while read -r tag; do
          echo "Removing $tag"
          gh release delete "$tag" --cleanup-tag --yes
        done

    - name: Remove keychain
      if: always()
      run: security delete-keychain "$KEYCHAIN" || true
